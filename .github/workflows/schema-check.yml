name: Schema Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'Impact-Map/generate_map.go'

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        working-directory: Impact-Map
        run: go build -o /dev/null generate_map.go

      - name: Run schema validation tests
        working-directory: Impact-Map
        run: go test -v -run 'Test(SheetTabNames|OutputHeaders|StatusFilter|CoordinateParsing)' .
